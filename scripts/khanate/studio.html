<!doctype html><html lang="en"><meta charset="UTF-8"><title>Khanate · world inspection</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#map{position:absolute;inset:0;width:100%;height:100%}#tools{position:fixed;z-index:40;left:20px;top:20px;padding:12px;background:#faf6ed;color:#303b38;border-radius:14px;font:14px sans-serif;display:flex;gap:10px;align-items:center}button{padding:10px;border:1px solid #d6d7c9;border-radius:10px;background:#f2eadb;color:#303b38}</style><div class="play-application"><div id="map" class="city-canvas" data-testid="city-map"></div><div id="tools" data-occludes-city><b>Khanate</b><button id="school">Teaching yurts</button><button id="overview">Whole city</button><output id="status">Building the city…</output></div></div><script type="module">
import '/src/world/city.css';import '/src/ui/alem.css';import '/src/ui/fullscreen.css';
import {createCityRuntime} from '/src/world/runtime-core.js';
import world from '/src/world/khanate/definition.js';
const props={mode:'khanate',districts:world.bootstrap.districts.features.map(d=>({id:d.id,name:d.properties.name})),focusedDistrict:null,selectedCommitment:null,candidate:null,commitments:[],result:null,construction:[],comparisonPosition:0,cameraRequest:{id:0,kind:'overview'},scenarioRevision:0,occlusions:[{left:20,top:20,right:600,bottom:80}],onDistrictSelect:id=>{props.focusedDistrict=id;props.cameraRequest={id:props.cameraRequest.id+1,kind:'district',districtId:id};runtime.update(props);},onCommitmentSelect:()=>{}};
const runtime=await createCityRuntime(document.querySelector('#map'),props,{select:()=>{},help:()=>{},physical:()=>{},project:()=>{},encounter:()=>{}},s=>document.querySelector('#status').textContent=s.kind==='ready'?'Ready':s.message,new AbortController().signal,world);
document.querySelector('#school').onclick=()=>{const next={...props,commitments:[{initiativeId:'M7',scope:'district',districtId:'esil'}],construction:[{key:'M7:esil',startedAt:Date.now(),durationMs:12000}],scenarioRevision:1};runtime.update(next);Object.assign(props,next);};
document.querySelector('#overview').onclick=()=>{props.cameraRequest={id:props.cameraRequest.id+1,kind:'overview'};runtime.update({...props});};
</script></html>
